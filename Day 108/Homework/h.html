<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" >
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      color: #000;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      font-weight: bold;
    }

    nav .left, nav .right {
      display: flex;
      gap: 20px;
    }

    nav .logo {
      font-family: cursive;
      font-size: 24px;
    }

    .downg {
      text-align: center;
      padding: 50px 20px 20px;
    }

    .downg h1 {
      font-size: 48px;
      font-weight: 700;
    }

    .downg p {
      font-style: italic;
      margin-top: 10px;
      font-size: 18px;
    }

    .downg a {
      margin: 20px 10px 0;
      display: inline-block;
      text-decoration: underline;
      color: #000;
      font-weight: bold;
    }

    .img {
      width: 100%;
      height: 80vh;
      background: url('image.png') center/contain no-repeat;
      margin-top: 30px;

    }
  </style>
</head>
<body>
  <nav>
    <div class="left">
      <span>MEN</span>
      <span>WOMEN</span>
      <span>CLUB</span>
      <span>STORIES</span>
      <span>MTB</span>
    </div>
    <div class="logo">Rapha.</div>
    <div class="right">
      <span>🔍</span>
      <span>👤</span>
      <span>🛒</span>
    </div>
  </nav>

  <div class="downg">
    <h1>RAPHA MTB</h1>
    <p>Keep riding in any conditions.</p>
    <a href="#">Watch the trailer</a>
    <a href="#">Shop new arrivals</a>
  </div>

  <div class="img"></div>
</body>
</html>
